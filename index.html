<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schoolbibliotheek Sint-Pieters - Vind een boek</title>
    <!-- Google Font & PapaParse -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        :root {
            --primary: #1b365d;        /* Donkerblauw schoolstijl */
            --accent: #ffd200;         /* Speels boekenzoeker-geel */
            --coral: #ff5a5f;          /* Kleuraccent voor tags */
            --bg: #f4f6f9;
            --surface: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --radius-lg: 20px;
            --radius-sm: 12px;
            --shadow-subtle: 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 16px 28px rgba(0, 0, 0, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding-bottom: 80px;
        }

        /* Hero / Header in Boekenzoeker stijl */
        header {
            background: linear-gradient(135deg, var(--primary) 0%, #0d1e36 100%);
            padding: 30px 20px 80px;
            text-align: center;
            color: white;
            position: relative;
        }

        .header-brand {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            background: rgba(255, 255, 255, 0.12);
            padding: 10px 24px;
            border-radius: 999px;
            backdrop-filter: blur(8px);
            margin-bottom: 24px;
        }

        .header-brand img {
            height: 42px;
            width: auto;
            border-radius: 6px;
            background: white;
            padding: 3px;
        }

        .header-brand span {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        header h1 {
            font-size: clamp(24px, 4vw, 38px);
            font-weight: 800;
            max-width: 780px;
            margin: 0 auto 12px;
            line-height: 1.25;
        }

        header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            max-width: 580px;
            margin: 0 auto;
        }

        /* Zoek & Filter module (zwevend over header) */
        .filter-wrapper {
            max-width: 1060px;
            margin: -45px auto 40px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .filter-card {
            background: var(--surface);
            padding: 24px 30px;
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display: grid;
            grid-template-columns: 2fr 1fr 1.2fr;
            gap: 20px;
            align-items: center;
        }

        @media (max-width: 820px) {
            .filter-card {
                grid-template-columns: 1fr;
                padding: 20px;
                gap: 15px;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
        }

        .input-group input, .input-group select {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border: 2px solid #e5e7eb;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            background-color: #fafafa;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(27, 54, 93, 0.1);
        }

        /* Resultatensectie & Grid */
        .catalog-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .counter-bar {
            margin-bottom: 24px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 30px;
        }

        /* Boekenkaart in Boekenzoeker look */
        .book-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-subtle);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            position: relative;
        }

        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
        }

        /* Cover & Labels */
        .cover-area {
            position: relative;
            width: 100%;
            height: 320px;
            background: #eef2f6;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .cover-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .book-card:hover .cover-area img {
            transform: scale(1.04);
        }

        .badge-graad {
            position: absolute;
            top: 14px;
            left: 14px;
            background: var(--primary);
            color: white;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 6px 12px;
            border-radius: 999px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .badge-locatie {
            position: absolute;
            bottom: 14px;
            right: 14px;
            background: var(--accent);
            color: #222;
            font-size: 10px;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 2;
        }

        .no-cover-box {
            padding: 20px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Kaartcontent */
        .card-details {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.35;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .card-author {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .card-tags {
            margin-top: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag-pill {
            background-color: var(--bg);
            color: #4b5563;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            line-height: 1;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: var(--radius-lg);
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-brand">
            <img src="logo.jpg" alt="Logo" onerror="this.style.display='none'">
            <span>Schoolbibliotheek Sint-Pieters</span>
        </div>
        <h1>Vind jouw volgende lievelingsboek</h1>
        <p>Doorzoek de catalogus op trefwoord, leeftijd of ontdek boeken rond jouw favoriete thema.</p>
    </header>

    <div class="filter-wrapper">
        <div class="filter-card">
            <div class="input-group">
                <label for="searchInput">Zoekopdracht</label>
                <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="Titel of auteur...">
            </div>
            <div class="input-group">
                <label for="graadFilter">Leeftijd</label>
                <select id="graadFilter" onchange="applyFilters()">
                    <option value="">Alle graden</option>
                </select>
            </div>
            <div class="input-group">
                <label for="themaFilter">Thema</label>
                <select id="themaFilter" onchange="applyFilters()">
                    <option value="">Alle thema's</option>
                </select>
            </div>
        </div>
    </div>

    <div class="catalog-container">
        <div class="counter-bar" id="resultCount">Boeken laden...</div>
        <div class="book-grid" id="bookGrid"></div>
    </div>

    <script>
        let allBooks = [];

        window.addEventListener('DOMContentLoaded', () => {
            // Leest automatisch 'boeken.csv' in dezelfde map uit
            Papa.parse('boeken.csv', {
                download: true,
                header: false,
                complete: function(results) {
                    allBooks = results.data.filter(row => 
                        row.length >= 5 && row[0] && row[0].trim() !== '' && !row[0].toLowerCase().includes('titel')
                    );
                    initDropdowns(allBooks);
                    renderBooks(allBooks);
                },
                error: function(err) {
                    document.getElementById('resultCount').textContent = 'Fout bij het laden van het bestand boeken.csv.';
                }
            });
        });

        function renderBooks(books) {
            const grid = document.getElementById('bookGrid');
            const counter = document.getElementById('resultCount');
            grid.innerHTML = '';

            counter.textContent = `${books.length} boek${books.length === 1 ? '' : 'en'} gevonden`;

            if (books.length === 0) {
                grid.innerHTML = `<div class="empty-state">Geen boeken gevonden voor deze selectie.</div>`;
                return;
            }

            books.forEach(row => {
                const titel = row[0] ? row[0].trim() : '';
                const auteur = row[1] ? row[1].trim() : '';
                const rawTags = row[2] ? row[2].trim() : '';
                const graad = row[3] ? row[3].trim() : '';
                const locatie = row[4] ? row[4].trim() : '';
                const cover = row[5] ? row[5].trim() : '';

                // Automatische cover URL bepalen via Open Library
                let coverImg = '';
                if (cover) {
                    const url = cover.startsWith('http') ? cover : `https://covers.openlibrary.org/b/isbn/${cover}-M.jpg`;
                    coverImg = `<img src="${url}" alt="${titel}" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'no-cover-box\\'>Geen cover</div>';">`;
                } else {
                    coverImg = `<div class="no-cover-box">Geen cover</div>`;
                }

                // Tag labels opsplitsen
                const tagsList = rawTags ? rawTags.split(',').map(t => t.trim()).filter(Boolean) : [];
                const tagsHtml = tagsList.map(t => `<span class="tag-pill">${t}</span>`).join('');

                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="cover-area">
                        ${graad ? `<span class="badge-graad">${graad}</span>` : ''}
                        ${coverImg}
                        ${locatie ? `<span class="badge-locatie">${locatie}</span>` : ''}
                    </div>
                    <div class="card-details">
                        <h3 class="card-title">${titel}</h3>
                        <div class="card-author">${auteur}</div>
                        <div class="card-tags">
                            ${tagsHtml}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function initDropdowns(books) {
            const graden = new Set();
            const themas = new Set();

            books.forEach(row => {
                if (row[3]) graden.add(row[3].trim());
                if (row[2]) {
                    row[2].split(',').forEach(tag => {
                        const clean = tag.trim().toLowerCase();
                        if (clean) themas.add(clean);
                    });
                }
            });

            populateSelect('graadFilter', Array.from(graden).sort());
            populateSelect('themaFilter', Array.from(themas).sort());
        }

        function populateSelect(id, list) {
            const select = document.getElementById(id);
            list.forEach(val => {
                const opt = document.createElement('option');
                opt.value = val;
                opt.textContent = val.charAt(0).toUpperCase() + val.slice(1);
                select.appendChild(opt);
            });
        }

        function applyFilters() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const graadVal = document.getElementById('graadFilter').value.toLowerCase();
            const themaVal = document.getElementById('themaFilter').value.toLowerCase();

            const filtered = allBooks.filter(row => {
                const titel = (row[0] || '').toLowerCase();
                const auteur = (row[1] || '').toLowerCase();
                const tags = (row[2] || '').toLowerCase();
                const graad = (row[3] || '').toLowerCase();

                const matchSearch = titel.includes(searchVal) || auteur.includes(searchVal);
                const matchGraad = !graadVal || graad === graadVal;
                const matchThema = !themaVal || tags.includes(themaVal);

                return matchSearch && matchGraad && matchThema;
            });

            renderBooks(filtered);
        }
    </script>
</body>
</html>
