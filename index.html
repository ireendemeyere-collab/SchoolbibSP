<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schoolbibliotheek Sint-Pieters - Boekenzoeker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse voor het inlezen van de CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .custom-checkbox { accent-color: #db2777; width: 1.1rem; height: 1.1rem; cursor: pointer; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-slate-100 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <img src="logo.jpg" alt="Logo Boekenbende Sint-Pieters" class="w-14 h-14 rounded-2xl object-cover shadow-md border border-slate-200" onerror="this.src='https://via.placeholder.com/60?text=Logo'">
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Boekenbende Sint-Pieters</h1>
                    <p class="text-sm font-medium text-pink-600">Officiële catalogus van de schoolbibliotheek</p>
                </div>
            </div>
            <!-- Zoekbalk -->
            <div class="w-full md:w-96 relative">
                <input type="text" id="searchInput" placeholder="Zoek op titel of auteur..." 
                    class="w-full pl-11 pr-4 py-2.5 bg-slate-100 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-pink-400 focus:bg-white transition">
                <svg class="w-5 h-5 text-slate-400 absolute left-4 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- Sidebar / Filters -->
        <aside class="lg:col-span-1 space-y-6">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-slate-900">Filters</h3>
                <button id="resetFilters" class="text-xs text-pink-600 hover:text-pink-800 font-semibold transition">Alles wissen</button>
            </div>

            <!-- Filter op Taal -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <h4 class="font-bold text-slate-900 text-sm mb-3 flex items-center gap-2">
                    <svg class="w-4 h-4 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg>
                    Taal
                </h4>
                <div class="space-y-2" id="taalCheckboxes"></div>
            </div>

            <!-- Filter op Graad -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <h4 class="font-bold text-slate-900 text-sm mb-3 flex items-center gap-2">
                    <svg class="w-4 h-4 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    Graad
                </h4>
                <div class="space-y-2" id="graadCheckboxes"></div>
            </div>

            <!-- Filter op Tags -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <h4 class="font-bold text-slate-900 text-sm mb-3 flex items-center gap-2">
                    <svg class="w-4 h-4 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
                    Thema's & Tags
                </h4>
                <div class="space-y-2 max-h-60 overflow-y-auto pr-1" id="tagCheckboxes"></div>
            </div>
        </aside>

        <!-- Book Grid -->
        <section class="lg:col-span-3 flex flex-col gap-6">
            <div class="flex justify-between items-center bg-white px-5 py-3 rounded-2xl shadow-sm border border-slate-100">
                <span id="bookCount" class="text-sm font-medium text-slate-600">Boeken laden uit CSV...</span>
            </div>

            <div id="bookGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5">
                <!-- Boekenkaarten komen hier -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-100 py-6 text-center text-sm text-slate-400 mt-auto">
        <p>&copy; 2026 Schoolbibliotheek Sint-Pieters • Boekenbende</p>
    </footer>

    <!-- CSV Inlees logica -->
    <script>
        let allBooks = [];
        let searchQuery = '';

        function bepaalTaal(locatie) {
            if (!locatie) return 'Nederlands';
            const l = locatie.toLowerCase();
            if (l.includes('engels')) return 'Engels';
            if (l.includes('frans')) return 'Frans';
            if (l.includes('duits')) return 'Duits';
            return 'Nederlands';
        }

        // CSV inlezen via fetch en PapaParse
        fetch('boeken.csv')
            .then(response => {
                if (!response.ok) throw new Error('Kan boeken.csv niet vinden');
                return response.text();
            })
            .then(csvText => {
                // Sla de eerste regel (Column1;...) over als die er is
                const lines = csvText.split('\n').filter(l => l.trim() !== '');
                const cleanCsv = lines[0].includes('Column1') ? lines.slice(1).join('\n') : csvText;

                Papa.parse(cleanCsv, {
                    header: true,
                    delimiter: ';',
                    skipEmptyLines: true,
                    complete: function(results) {
                        allBooks = results.data.map(book => ({
                            Titel: book.Titel ? book.Titel.trim() : '',
                            Auteur: book.Auteur ? book.Auteur.trim() : '',
                            Tags: book.Tags ? book.Tags.trim() : '',
                            Graad: book.Graad ? book.Graad.trim() : '',
                            Locatie: book.Locatie ? book.Locatie.trim() : '',
                            Taal: bepaalTaal(book.Locatie)
                        })).filter(b => b.Titel !== ''); // Filter lege rijen weg

                        initFilters();
                        filterAndRender();
                    }
                });
            })
            .catch(error => {
                console.error(error);
                document.getElementById('bookCount').textContent = 'Fout bij het laden van boeken.csv. Controleer of het bestand in dezelfde map staat.';
            });

        function initFilters() {
            // 1. Talen vullen
            const talen = [...new Set(allBooks.map(b => b.Taal))].filter(Boolean).sort();
            const taalContainer = document.getElementById('taalCheckboxes');
            taalContainer.innerHTML = '';
            talen.forEach(taal => {
                taalContainer.innerHTML += `
                    <label class="flex items-center gap-2.5 text-sm text-slate-600 cursor-pointer hover:text-slate-900">
                        <input type="checkbox" name="taal" value="${taal}" class="custom-checkbox filter-input">
                        <span>${taal}</span>
                    </label>
                `;
            });

            // 2. Graden vullen
            const graden = [...new Set(allBooks.map(b => b.Graad))].filter(Boolean).sort();
            const graadContainer = document.getElementById('graadCheckboxes');
            graadContainer.innerHTML = '';
            graden.forEach(graad => {
                graadContainer.innerHTML += `
                    <label class="flex items-center gap-2.5 text-sm text-slate-600 cursor-pointer hover:text-slate-900">
                        <input type="checkbox" name="graad" value="${graad}" class="custom-checkbox filter-input">
                        <span>${graad}</span>
                    </label>
                `;
            });

            // 3. Tags vullen
            const tagSet = new Set();
            allBooks.forEach(book => {
                if (book.Tags) {
                    book.Tags.split(',').forEach(t => tagSet.add(t.trim().toLowerCase()));
                }
            });
            const tagContainer = document.getElementById('tagCheckboxes');
            tagContainer.innerHTML = '';
            Array.from(tagSet).sort().forEach(tag => {
                tagContainer.innerHTML += `
                    <label class="flex items-center gap-2.5 text-sm text-slate-600 cursor-pointer hover:text-slate-900">
                        <input type="checkbox" name="tag" value="${tag}" class="custom-checkbox filter-input">
                        <span class="capitalize">${tag}</span>
                    </label>
                `;
            });

            document.querySelectorAll('.filter-input').forEach(input => {
                input.addEventListener('change', filterAndRender);
            });
        }

        function filterAndRender() {
            const selectedTalen = Array.from(document.querySelectorAll('input[name="taal"]:checked')).map(cb => cb.value);
            const selectedGraden = Array.from(document.querySelectorAll('input[name="graad"]:checked')).map(cb => cb.value);
            const selectedTags = Array.from(document.querySelectorAll('input[name="tag"]:checked')).map(cb => cb.value);

            const filtered = allBooks.filter(book => {
                const matchSearch = !searchQuery || 
                    (book.Titel && book.Titel.toLowerCase().includes(searchQuery.toLowerCase())) || 
                    (book.Auteur && book.Auteur.toLowerCase().includes(searchQuery.toLowerCase()));
                
                const matchTaal = selectedTalen.length === 0 || selectedTalen.includes(book.Taal);
                const matchGraad = selectedGraden.length === 0 || selectedGraden.includes(book.Graad);
                
                let matchTag = true;
                if (selectedTags.length > 0) {
                    const bookTags = book.Tags ? book.Tags.toLowerCase() : '';
                    matchTag = selectedTags.some(t => bookTags.includes(t));
                }

                return matchSearch && matchTaal && matchGraad && matchTag;
            });

            document.getElementById('bookCount').textContent = `${filtered.length} boeken gevonden`;

            const grid = document.getElementById('bookGrid');
            grid.innerHTML = '';

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-12 text-center text-slate-400">
                        <p class="text-base font-semibold">Geen boeken gevonden met deze filters.</p>
                        <p class="text-sm mt-1">Probeer andere filters of wis je selectie.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(book => {
                const tagsHtml = book.Tags 
                    ? book.Tags.split(',').map(t => `<span class="text-[11px] bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md font-medium hover:bg-slate-200 transition">${t.trim()}</span>`).join('') 
                    : '';

                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex flex-col justify-between hover:shadow-md hover:border-pink-200 transition group';
                card.innerHTML = `
                    <div>
                        <!-- Graad badge bovenaan -->
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <span class="text-[10px] font-bold uppercase tracking-wider bg-slate-900 text-white px-2.5 py-1 rounded-lg">${book.Graad || ''}</span>
                        </div>
                        <!-- Goodreads stijl: Titel, auteur, tags, taal en locatie -->
                        <h4 class="font-bold text-slate-900 text-base leading-snug mb-1 group-hover:text-pink-600 transition">${book.Titel}</h4>
                        <p class="text-xs text-slate-500 font-medium mb-3">door ${book.Auteur}</p>
                        
                        <!-- Tags -->
                        <div class="flex flex-wrap gap-1.5 mb-4">
                            ${tagsHtml}
                        </div>
                    </div>
                    <!-- Taal en Locatie onderaan -->
                    <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                        <span class="font-semibold text-pink-600 bg-pink-50 px-2.5 py-1 rounded-lg">${book.Taal}</span>
                        <span class="truncate max-w-[160px] bg-slate-50 px-2.5 py-1 rounded-lg" title="${book.Locatie}">${book.Locatie}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            filterAndRender();
        });

        document.getElementById('resetFilters').addEventListener('click', () => {
            document.querySelectorAll('.filter-input').forEach(input => input.checked = false);
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            filterAndRender();
        });
    </script>
</body>
</html>
