<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boekenbende Sint-Pieters - Boekenzoeker</title>
    <!-- Tailwind CSS voor modern en responsief design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse voor het inlezen van de CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .tag-pill { transition: all 0.2s ease; }
        .tag-pill:hover, .tag-pill.active { background-color: #1e293b; color: white; transform: translateY(-1px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-slate-100 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <img src="logo.jpg" alt="Logo Boekenbende Sint-Pieters" class="w-14 h-14 rounded-2xl object-cover shadow-md border border-slate-200">
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Boekenbende Sint-Pieters</h1>
                    <p class="text-sm text-slate-500">Ontdek je volgende favoriete boek!</p>
                </div>
            </div>
            <!-- Zoekbalk -->
            <div class="w-full md:w-96 relative">
                <input type="text" id="searchInput" placeholder="Zoek op titel of auteur..." 
                    class="w-full pl-11 pr-4 py-2.5 bg-slate-100 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-pink-400 focus:bg-white transition">
                <svg class="w-5 h-5 text-slate-400 absolute left-4 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- Sidebar / Filters -->
        <aside class="lg:col-span-1 space-y-6">
            <!-- Filter op Graad -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-900 mb-3 flex items-center gap-2">
                    <svg class="w-4 h-4 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    Graad
                </h3>
                <div class="space-y-1.5" id="graadFilters">
                    <button data-graad="all" class="graad-btn w-full text-left px-3 py-2 rounded-xl text-sm font-medium bg-pink-50 text-pink-700 transition">Alle graden</button>
                    <button data-graad="Eerste graad" class="graad-btn w-full text-left px-3 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition">Eerste graad</button>
                    <button data-graad="Tweede graad" class="graad-btn w-full text-left px-3 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition">Tweede graad</button>
                    <button data-graad="Derde graad" class="graad-btn w-full text-left px-3 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition">Derde graad</button>
                </div>
            </div>

            <!-- Populaire Tags -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-900 mb-3 flex items-center gap-2">
                    <svg class="w-4 h-4 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
                    Thema's & Tags
                </h3>
                <div class="flex flex-wrap gap-1.5 max-h-72 overflow-y-auto pr-1" id="tagContainer">
                    <!-- Wordt dynamisch gevuld -->
                </div>
            </div>

            <button id="resetFilters" class="w-full py-2.5 px-4 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-sm font-medium transition">
                Filters wissen
            </button>
        </aside>

        <!-- Book Grid -->
        <section class="lg:col-span-3 flex flex-col gap-6">
            <div class="flex justify-between items-center bg-white px-5 py-3 rounded-2xl shadow-sm border border-slate-100">
                <span id="bookCount" class="text-sm font-medium text-slate-600">Boeken laden...</span>
            </div>

            <div id="bookGrid" class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-5">
                <!-- Boekenkaarten komen hier -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-100 py-6 text-center text-sm text-slate-400 mt-auto">
        <p>&copy; 2026 Boekenbende Sint-Pieters • Gemaakt met ❤️ voor leerlingen</p>
    </footer>

    <!-- JavaScript logica -->
    <script>
        let allBooks = [];
        let selectedGraad = 'all';
        let selectedTag = null;
        let searchQuery = '';

        // Laad de CSV
        Papa.parse('boeken.csv', {
            download: true,
            header: true,
            delimiter: ';',
            skipEmptyLines: true,
            complete: function(results) {
                allBooks = results.data;
                initTags();
                filterAndRender();
            }
        });

        function initTags() {
            const tagSet = new Set();
            allBooks.forEach(book => {
                if (book.Tags) {
                    book.Tags.split(',').forEach(t => tagSet.add(t.trim().toLowerCase()));
                }
            });

            const container = document.getElementById('tagContainer');
            container.innerHTML = '';
            Array.from(tagSet).sort().forEach(tag => {
                const btn = document.createElement('button');
                btn.className = 'tag-pill text-xs bg-slate-100 text-slate-600 px-2.5 py-1.5 rounded-lg font-medium';
                btn.textContent = tag;
                btn.onclick = () => {
                    selectedTag = selectedTag === tag ? null : tag;
                    document.querySelectorAll('.tag-pill').forEach(b => b.classList.remove('active', 'bg-slate-900', 'text-white'));
                    if (selectedTag) btn.classList.add('active', 'bg-slate-900', 'text-white');
                    filterAndRender();
                };
                container.appendChild(btn);
            });
        }

        function filterAndRender() {
            const filtered = allBooks.filter(book => {
                const matchGraad = selectedGraad === 'all' || book.Graad === selectedGraad;
                const matchSearch = !searchQuery || 
                    book.Titel.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    book.Auteur.toLowerCase().includes(searchQuery.toLowerCase());
                const matchTag = !selectedTag || (book.Tags && book.Tags.toLowerCase().includes(selectedTag));
                return matchGraad && matchSearch && matchTag;
            });

            document.getElementById('bookCount').textContent = `${filtered.length} boeken gevonden`;

            const grid = document.getElementById('bookGrid');
            grid.innerHTML = '';

            filtered.forEach(book => {
                const isbn = book.cover;
                // Open Library cover URL op basis van ISBN
                const coverUrl = isbn ? `https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg` : 'https://via.placeholder.com/150x200?text=Geen+Cover';

                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col hover:shadow-md transition group';
                card.innerHTML = `
                    <div class="h-52 bg-slate-100 relative overflow-hidden flex items-center justify-center">
                        <img src="${coverUrl}" alt="${book.Titel}" class="h-full w-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/150x200?text=Geen+Cover'">
                        <span class="absolute top-2 right-2 bg-slate-900/70 backdrop-blur-md text-white text-[10px] font-semibold px-2 py-1 rounded-full">${book.Graad || ''}</span>
                    </div>
                    <div class="p-4 flex flex-col flex-grow justify-between">
                        <div>
                            <h4 class="font-bold text-slate-900 text-sm line-clamp-1 mb-1" title="${book.Titel}">${book.Titel}</h4>
                            <p class="text-xs text-slate-500 mb-2">${book.Auteur}</p>
                        </div>
                        <div>
                            <div class="flex flex-wrap gap-1 mb-3">
                                ${book.Tags ? book.Tags.split(',').slice(0, 2).map(t => `<span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md">${t.trim()}</span>`).join('') : ''}
                            </div>
                            <span class="inline-block text-[10px] font-medium text-pink-600 bg-pink-50 px-2.5 py-1 rounded-lg w-full text-center">${book.Locatie}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            filterAndRender();
        });

        document.querySelectorAll('.graad-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.graad-btn').forEach(b => b.classList.remove('bg-pink-50', 'text-pink-700', 'font-semibold'));
                document.querySelectorAll('.graad-btn').forEach(b => b.classList.add('text-slate-600'));
                e.target.classList.add('bg-pink-50', 'text-pink-700', 'font-semibold');
                selectedGraad = e.target.getAttribute('data-graad');
                filterAndRender();
            });
        });

        document.getElementById('resetFilters').addEventListener('click', () => {
            selectedGraad = 'all';
            selectedTag = null;
            searchQuery = '';
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('.tag-pill').forEach(b => b.classList.remove('active', 'bg-slate-900', 'text-white'));
            document.querySelector('[data-graad="all"]').click();
        });
    </script>
</body>
</html>
